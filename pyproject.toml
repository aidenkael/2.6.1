[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "profit-accounting-2-6"
version = "2.6.0rc1"
description = "Local PySide6 profit, logistics and record management application for SHEIN sellers"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "PySide6>=6.7,<7",
  "openpyxl>=3.1,<4",
  "Pillow>=10.0,<12",
  "playwright>=1.60,<1.61",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
]

[project.scripts]
profit-accounting-2-6 = "profit_accounting_26.ui.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
